name: CI

# IMPORTANT: only the master-branch push triggers this workflow. We auto-create a
# version tag + GitHub Release on every push, but the workflow does NOT listen to
# tag pushes (`on.push.tags` is absent). Creating a tag ref therefore does not
# retrigger the workflow, so there is no push -> build -> push loop.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows/g++)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build & run stress tests (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -std=c++17 -Wall -fopenmp stress.cpp -o stress
          ./stress
      - name: Build benchmark (Linux)
        if: runner.os == 'Linux'
        run: g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench

      - name: Build & run stress tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -O2 -std=c++17 -Wall -fopenmp stress.cpp -o stress.exe
          ./stress.exe
      - name: Build benchmark (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench.exe

      # Daily push: downloadable binaries as artifacts (never committed).
      - name: Upload binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-linux-binaries
          path: |
            stress
            bench
      - name: Upload binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-windows-binaries
          path: |
            stress.exe
            bench.exe

  # Auto-release on every push to master: auto-tag + create a GitHub Release and
  # attach compiled binaries. Release assets are NOT commits, so this cannot start
  # a build loop; and because the workflow does not listen to tag pushes, the
  # created tag itself does not retrigger anything.
  release:
    name: Auto tag & release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Build Windows binaries (cross-compiled, static)
        run: |
          x86_64-w64-mingw32-g++ -O2 -std=c++17 -static -fopenmp stress.cpp -o stress.exe
          x86_64-w64-mingw32-g++ -O2 -std=c++17 -static -fopenmp bench.cpp -o bench.exe
      - name: Build Linux binaries
        run: |
          g++ -O2 -std=c++17 -fopenmp -mavx2 stress.cpp -o stress
          g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench
      - name: Auto tag + create release (Linux + Windows exe + header)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "Auto release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}" 2>/dev/null || true
          gh release create "$TAG" stress bench stress.exe bench.exe lxy_sort.hpp \
            --title "$TAG" \
            --notes "Auto release from commit \`${{ github.sha }}\`.\n\n- Linux: \`stress\`, \`bench\`\n- Windows: \`stress.exe\`, \`bench.exe\` (static)\n- Header: \`lxy_sort.hpp\`"
