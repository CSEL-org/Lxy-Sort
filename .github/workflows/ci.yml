name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows/g++)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      # ---- Linux: build, run the 6606 stress tests, build benchmark ----
      - name: Build & run stress tests (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -std=c++17 -Wall -fopenmp stress.cpp -o stress
          ./stress
      - name: Build benchmark (Linux)
        if: runner.os == 'Linux'
        run: g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench

      # ---- Windows: build, run the 6606 stress tests, build benchmark ----
      - name: Build & run stress tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -O2 -std=c++17 -Wall -fopenmp stress.cpp -o stress.exe
          ./stress.exe
      - name: Build benchmark (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench.exe

      # Downloadable binaries. These are uploaded as CI *artifacts* and are NOT
      # committed back to the repository — CI never creates a new commit, so the
      # push -> build -> push loop you worried about cannot happen.
      - name: Upload binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-linux-binaries
          path: |
            stress
            bench

      - name: Upload binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-windows-binaries
          path: |
            stress.exe
            bench.exe
