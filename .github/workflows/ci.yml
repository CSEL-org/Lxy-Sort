name: CI

# IMPORTANT: only the master-branch push triggers this workflow. We auto-create a
# version tag + GitHub Release on every push, but the workflow does NOT listen to
# tag pushes (`on.push.tags` is absent). Creating a tag ref therefore does not
# retrigger the workflow, so there is no push -> build -> push loop.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows/g++)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Setup OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build & run stress tests (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -std=c++17 -Wall -fopenmp stress.cpp -o stress
          ./stress
      - name: Build benchmark (Linux)
        if: runner.os == 'Linux'
        run: g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench

      - name: Build & run stress tests (macOS)
        if: runner.os == 'macOS'
        run: |
          g++ -O2 -std=c++17 -Wall -Xpreprocessor -fopenmp -I"$(brew --prefix libomp)/include" -L"$(brew --prefix libomp)/lib" -lomp stress.cpp -o stress
          ./stress
      - name: Build benchmark (macOS)
        if: runner.os == 'macOS'
        run: g++ -O2 -std=c++17 -Xpreprocessor -fopenmp -I"$(brew --prefix libomp)/include" -L"$(brew --prefix libomp)/lib" -lomp bench.cpp -o bench

      - name: Build & run stress tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -O2 -std=c++17 -Wall -fopenmp stress.cpp -o stress.exe
          ./stress.exe
      - name: Build benchmark (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench.exe

      # Daily push: downloadable binaries as artifacts (never committed).
      - name: Upload binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-linux-binaries
          path: |
            stress
            bench
      - name: Upload binaries (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-macos-binaries
          path: |
            stress
            bench
      - name: Upload binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lxysort-windows-binaries
          path: |
            stress.exe
            bench.exe

  # ---- Auto tag + create an (initially empty) GitHub Release ----
  release-tag:
    name: Create version tag & release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rt.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: rt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Auto release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}" 2>/dev/null || true
          gh release create "$TAG" --title "$TAG" \
            --notes "Auto release from commit \`${{ github.sha }}\`."

  # ---- Build on every OS and attach the binaries + header to the Release ----
  release-build:
    name: Build & attach release assets (${{ matrix.os }})
    needs: release-tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows/g++)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Setup OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -std=c++17 -fopenmp -mavx2 stress.cpp -o stress
          g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench
      - name: Build (macOS, arm64)
        if: runner.os == 'macOS'
        run: |
          g++ -O2 -std=c++17 -Xpreprocessor -fopenmp -I"$(brew --prefix libomp)/include" -L"$(brew --prefix libomp)/lib" -lomp stress.cpp -o stress-macos
          g++ -O2 -std=c++17 -Xpreprocessor -fopenmp -I"$(brew --prefix libomp)/include" -L"$(brew --prefix libomp)/lib" -lomp bench.cpp -o bench-macos
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -O2 -std=c++17 -fopenmp -mavx2 stress.cpp -o stress.exe
          g++ -O2 -std=c++17 -fopenmp -mavx2 bench.cpp -o bench.exe

      - name: Attach binaries + header (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: gh release upload "$TAG" stress bench lxy_sort.hpp --clobber
      - name: Attach binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: gh release upload "$TAG" stress-macos bench-macos --clobber
      - name: Attach binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: gh release upload "$TAG" stress.exe bench.exe --clobber
